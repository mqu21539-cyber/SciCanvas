<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <g stroke="#1e293b" stroke-width="1" opacity="0.55">
    <path d="M0 40 H1200 M0 120 H1200 M0 200 H1200 M0 280 H1200 M0 360 H1200 M0 440 H1200 M0 520 H1200 M0 600 H1200 M0 680 H1200"/>
    <path d="M40 0 V720 M200 0 V720 M360 0 V720 M520 0 V720 M680 0 V720 M840 0 V720 M1000 0 V720 M1160 0 V720"/>
  </g>

  <text x="40" y="52" fill="#e2e8f0" font-size="26" font-weight="700">SciCanvas 架构</text>
  <text x="40" y="78" fill="#64748b" font-size="13">一句话 → 全息 2.5D 实验沙盒：两条生成路径，共用一个输出契约</text>

  <!-- ① 输入 -->
  <rect x="40" y="130" width="215" height="96" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="60" y="158" fill="#7dd3fc" font-size="12" letter-spacing="1">① INPUT</text>
  <text x="60" y="182" fill="#e2e8f0" font-size="14">概念 / 公式 / 教材段落</text>
  <text x="60" y="204" fill="#94a3b8" font-size="12">arXiv:1706.03762 → 自动抓摘要</text>

  <!-- ② 分诊 -->
  <rect x="40" y="300" width="215" height="120" rx="10" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.5"/>
  <text x="60" y="328" fill="#a5b4fc" font-size="12" letter-spacing="1">② ROUTER</text>
  <text x="60" y="352" fill="#e2e8f0" font-size="14">模型分诊：能用模板吗？</text>
  <text x="60" y="376" fill="#94a3b8" font-size="12">命中 → B 模板快车道</text>
  <text x="60" y="396" fill="#94a3b8" font-size="12">未命中 → A 双 Agent</text>

  <!-- ③ B 模板 -->
  <rect x="330" y="300" width="250" height="120" rx="10" fill="#0f172a" stroke="#10b981" stroke-opacity="0.55"/>
  <text x="350" y="328" fill="#6ee7b7" font-size="12" letter-spacing="1">③ B · 模板快车道</text>
  <text x="350" y="352" fill="#e2e8f0" font-size="14">10 个物理模板</text>
  <text x="350" y="376" fill="#94a3b8" font-size="12">模型只出 JSON（约 400 token）</text>
  <text x="350" y="398" fill="#34d399" font-size="12" font-weight="600">1.5 s · 稳定</text>

  <!-- ④ A 双 Agent -->
  <rect x="330" y="450" width="250" height="140" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.55"/>
  <text x="350" y="478" fill="#7dd3fc" font-size="12" letter-spacing="1">④ A · 双 Agent</text>
  <text x="350" y="502" fill="#e2e8f0" font-size="14">Planner → Coder</text>
  <text x="350" y="526" fill="#94a3b8" font-size="12">Coder 只写 ~50 行 reset/frame</text>
  <text x="350" y="548" fill="#94a3b8" font-size="12">不合契约 → 重写一次 → 再回落</text>
  <text x="350" y="574" fill="#38bdf8" font-size="12" font-weight="600">17 s · 任意概念</text>

  <!-- ⑤ 全息底座 -->
  <rect x="650" y="300" width="250" height="290" rx="10" fill="#0a1626" stroke="#38bdf8" stroke-opacity="0.55"/>
  <text x="670" y="328" fill="#7dd3fc" font-size="12" letter-spacing="1">⑤ HOLO SHELL（写一次）</text>
  <g font-size="12">
    <rect x="670" y="344" width="210" height="30" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="682" y="364" fill="#bae6fd">L0 坐标基准层</text>
    <rect x="670" y="382" width="210" height="30" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="682" y="402" fill="#bae6fd">L1 物理实体层</text>
    <rect x="670" y="420" width="210" height="30" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="682" y="440" fill="#bae6fd">L2 矢量与尾迹层</text>
    <rect x="670" y="458" width="210" height="30" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="682" y="478" fill="#bae6fd">L3 遥测 HUD 层</text>
  </g>
  <text x="670" y="512" fill="#64748b" font-size="11">示波器 · 子弹时间 · 四滤镜</text>
  <text x="670" y="530" fill="#64748b" font-size="11">平行残影 · 靶向锁定 · 2.5D 拆解</text>
  <text x="670" y="556" fill="#fbbf24" font-size="11">60 FPS · 10/10 模板实测</text>

  <!-- ⑥ 产物 -->
  <rect x="960" y="300" width="200" height="120" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="980" y="328" fill="#7dd3fc" font-size="12" letter-spacing="1">⑥ 单文件 HTML</text>
  <text x="980" y="354" fill="#e2e8f0" font-size="13">可下载 / 可离线</text>
  <text x="980" y="376" fill="#94a3b8" font-size="12">无任何外部依赖</text>

  <!-- 去处 -->
  <g font-size="12" fill="#94a3b8">
    <rect x="960" y="450" width="200" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="976" y="472">网页沙盒（iframe sandbox）</text>
    <rect x="960" y="494" width="200" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="976" y="516">导出卡带 / 展厅 / 插件</text>
  </g>

  <!-- 自愈回路 -->
  <rect x="330" y="630" width="560" height="56" rx="10" fill="#1a1206" stroke="#f59e0b" stroke-opacity="0.5"/>
  <text x="350" y="654" fill="#fbbf24" font-size="12" letter-spacing="1">⑦ SELF-HEAL LOOP</text>
  <text x="350" y="675" fill="#fcd34d" font-size="12">沙盒 onerror → postMessage → /api/fix → 只改最后一段 JS → 重渲染（全息产物绝不重写底座）</text>

  <!-- 连线 -->
  <g stroke="#38bdf8" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M255 178 H292 V360 H330"/>
    <path d="M255 360 H330"/>
    <path d="M580 360 H650"/>
    <path d="M580 520 H615 V470 H650"/>
    <path d="M900 420 H930 V360 H960"/>
    <path d="M1060 420 V450"/>
    <path d="M1060 450 V528"/>
    <path d="M330 660 H300 V420 H255" stroke="#334155" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <path d="M470 630 V612 H775 V592" stroke="#f59e0b" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  </g>

  <text x="40" y="700" fill="#475569" font-size="11">模型只写物理逻辑（reset / frame），四层舞台与全部交互由底座提供</text>
</svg>