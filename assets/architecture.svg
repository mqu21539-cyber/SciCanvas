<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect width="1240" height="720" fill="url(#bg)" />

  <!-- 标题 -->
  <text x="40" y="52" fill="#e2e8f0" font-size="24" font-weight="700">SciCanvas 架构</text>
  <text x="40" y="78" fill="#64748b" font-size="13">两条生成路径共用一套输出契约：单文件 HTML → iframe 沙盒</text>

  <!-- 用户 -->
  <rect x="40" y="120" width="180" height="72" rx="12" fill="#1e293b" stroke="#334155" />
  <text x="130" y="152" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">浏览器</text>
  <text x="130" y="174" fill="#94a3b8" font-size="12" text-anchor="middle">Next.js 工作台</text>

  <!-- 后端 -->
  <rect x="300" y="104" width="200" height="104" rx="12" fill="#111c33" stroke="#38bdf8" />
  <text x="400" y="136" fill="#7dd3fc" font-size="15" font-weight="600" text-anchor="middle">FastAPI</text>
  <text x="400" y="158" fill="#94a3b8" font-size="12" text-anchor="middle">/api/generate</text>
  <text x="400" y="178" fill="#94a3b8" font-size="12" text-anchor="middle">/api/fix · /api/health</text>
  <text x="400" y="196" fill="#64748b" font-size="11" text-anchor="middle">/api/templates</text>

  <line x1="220" y1="156" x2="292" y2="156" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="256" y="146" fill="#64748b" font-size="11" text-anchor="middle">POST</text>

  <!-- 路由 -->
  <rect x="560" y="122" width="150" height="68" rx="12" fill="#132033" stroke="#f59e0b" />
  <text x="635" y="150" fill="#fbbf24" font-size="14" font-weight="600" text-anchor="middle">router.py</text>
  <text x="635" y="170" fill="#94a3b8" font-size="11" text-anchor="middle">从严分诊</text>

  <line x1="500" y1="156" x2="552" y2="156" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- B 路径 -->
  <rect x="770" y="60" width="200" height="86" rx="12" fill="#0f2a24" stroke="#34d399" />
  <text x="870" y="90" fill="#6ee7b7" font-size="14" font-weight="600" text-anchor="middle">B · 模板引擎</text>
  <text x="870" y="110" fill="#94a3b8" font-size="11" text-anchor="middle">模型只出 JSON</text>
  <text x="870" y="128" fill="#94a3b8" font-size="11" text-anchor="middle">6 个参数化模板</text>

  <path d="M 710 140 L 745 140 L 745 103 L 762 103" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)" />
  <text x="716" y="132" fill="#34d399" font-size="11">命中 ~2s</text>

  <!-- A 路径 -->
  <rect x="770" y="190" width="110" height="60" rx="10" fill="#1a1633" stroke="#a78bfa" />
  <text x="825" y="216" fill="#c4b5fd" font-size="13" font-weight="600" text-anchor="middle">Planner</text>
  <text x="825" y="236" fill="#94a3b8" font-size="11" text-anchor="middle">概念→JSON</text>

  <rect x="910" y="190" width="110" height="60" rx="10" fill="#1a1633" stroke="#a78bfa" />
  <text x="965" y="216" fill="#c4b5fd" font-size="13" font-weight="600" text-anchor="middle">Coder</text>
  <text x="965" y="236" fill="#94a3b8" font-size="11" text-anchor="middle">JSON→HTML</text>

  <path d="M 710 156 L 745 156 L 745 220 L 762 220" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)" />
  <text x="752" y="276" fill="#a78bfa" font-size="11">未命中 ~25s</text>
  <line x1="880" y1="220" x2="902" y2="220" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 产物 -->
  <rect x="770" y="300" width="250" height="76" rx="12" fill="#0b1a2b" stroke="#38bdf8" />
  <text x="895" y="330" fill="#7dd3fc" font-size="14" font-weight="600" text-anchor="middle">单文件 HTML</text>
  <text x="895" y="352" fill="#94a3b8" font-size="11" text-anchor="middle">零依赖 · Tailwind CDN · canvas</text>
  <text x="895" y="369" fill="#64748b" font-size="11" text-anchor="middle">内含 window.onerror 桥</text>

  <line x1="870" y1="146" x2="870" y2="292" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="965" y1="250" x2="965" y2="292" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 沙盒 -->
  <rect x="770" y="420" width="250" height="86" rx="12" fill="#111c33" stroke="#334155" />
  <text x="895" y="450" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">iframe 沙盒</text>
  <text x="895" y="472" fill="#94a3b8" font-size="11" text-anchor="middle">sandbox="allow-scripts"</text>
  <text x="895" y="490" fill="#64748b" font-size="11" text-anchor="middle">srcdoc · 60fps</text>

  <line x1="895" y1="376" x2="895" y2="412" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />

  <!-- 自愈回路 -->
  <rect x="470" y="420" width="190" height="86" rx="12" fill="#2a1a10" stroke="#f59e0b" />
  <text x="565" y="450" fill="#fbbf24" font-size="14" font-weight="600" text-anchor="middle">Fixer Agent</text>
  <text x="565" y="472" fill="#94a3b8" font-size="11" text-anchor="middle">报错 + 原 HTML</text>
  <text x="565" y="490" fill="#64748b" font-size="11" text-anchor="middle">最多自愈 2 次</text>

  <path d="M 770 462 L 700 462" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)" />
  <text x="732" y="452" fill="#f59e0b" font-size="11" text-anchor="middle">onerror</text>

  <path d="M 470 445 L 430 445 L 430 200 L 500 200" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowAmber)" />
  <text x="418" y="330" fill="#f59e0b" font-size="11" transform="rotate(-90 418 330)" text-anchor="middle">POST /api/fix</text>

  <!-- dsh 插件 -->
  <rect x="40" y="420" width="330" height="150" rx="12" fill="#0e1a2a" stroke="#4d6bfe" />
  <text x="60" y="452" fill="#93a5ff" font-size="15" font-weight="600">DeepSeek Harness（dsh）</text>
  <text x="60" y="476" fill="#94a3b8" font-size="12">Host bundle：inject = ['tools']</text>
  <text x="60" y="498" fill="#94a3b8" font-size="12">ctx.tools.register(defineTool(...))</text>
  <text x="60" y="524" fill="#64748b" font-size="11">render_science_lab  ·  heal_science_lab</text>
  <text x="60" y="546" fill="#64748b" font-size="11">生成后自动登记 gallery/manifest.json</text>

  <path d="M 370 470 L 470 470" fill="none" stroke="#4d6bfe" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <text x="420" y="452" fill="#93a5ff" font-size="10" text-anchor="middle">走同一后端</text>

  <!-- 展品 -->
  <rect x="40" y="600" width="980" height="84" rx="12" fill="#0c1526" stroke="#1e293b" />
  <text x="60" y="630" fill="#cbd5e1" font-size="13" font-weight="600">静态展厅 gallery/</text>
  <text x="60" y="654" fill="#64748b" font-size="11">manifest.json 驱动 · 5 个预生成实验 · 纯静态可直接托管（GitHub Pages workflow 已就绪）</text>
  <text x="60" y="672" fill="#64748b" font-size="11">BYOK 在线生成：浏览器直连 DeepSeek（受 CORS 限制，仅作可选实验特性）</text>

  <text x="1080" y="690" fill="#334155" font-size="11" text-anchor="end">D:\SciCanvas · A-自由生成 / B-模板化生成</text>
</svg>